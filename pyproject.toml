[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
disable_error_code = ["untyped-decorator", "no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = """
    -ra
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
    --tracing=retain-on-failure
    --screenshot=only-on-failure
"""
markers = [
    "smoke: базовая проверка, что приложение доступно и отвечает",
    "auth: сценарии авторизации через UI",
    "e2e: сквозные сценарии через несколько экранов",
    "purchase: сценарии покупки и оформления заказа",
]
