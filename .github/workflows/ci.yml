name: CI

on:
  push:
    branches:
      ["main"]
  pull_request:
    branches:
      ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: ["chromium", "firefox", "webkit"]
      fail-fast: false
    env:
      BASE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: docker compose up
        run: docker compose up -d --wait

      - name: run e2e tests
        run: pytest --browser ${{ matrix.browser }}

      - name: logs docker compose
        if: failure()
        run: docker compose logs --no-color

      - name: Export Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results

      - name: Export test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results

  report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Retrieve history from gh-pages
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: copy history
        run: |
          cp -r gh-pages/history allure-results/ 2>/dev/null || true

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Allure CLI
        run: npm install -g allure-commandline

      - name: Generate allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      - name: Upload Artifact report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report