services:
  juice-shop:
    image: bkimminich/juice-shop:v20.2.0
    container_name: juice-shop
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          fetch('http://localhost:3000/rest/admin/application-version')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
